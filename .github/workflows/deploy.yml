name: Deploy

on:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,PORT,HOST,CORS_ORIGIN,RATE_LIMIT_MAX,CLUSTER_ENABLED,CACHE_ENABLED,CACHE_TTL_SECONDS
          script: |
            if [ ! -d ~/traffic ]; then
              git clone https://github.com/pedro-hs/500RPS-node-aws-posgres-docker.git ~/traffic
            fi
            cd ~/traffic && git pull
            cd back
            docker build -t traffic-api .
            docker stop traffic-api 2>/dev/null || true
            docker rm traffic-api 2>/dev/null || true
            docker run -d --name traffic-api -p 3000:3000 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e PORT="$PORT" \
              -e HOST="$HOST" \
              -e CORS_ORIGIN="$CORS_ORIGIN" \
              -e RATE_LIMIT_MAX="$RATE_LIMIT_MAX" \
              -e CLUSTER_ENABLED="$CLUSTER_ENABLED" \
              -e CACHE_ENABLED="$CACHE_ENABLED" \
              -e CACHE_TTL_SECONDS="$CACHE_TTL_SECONDS" \
              traffic-api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORT: ${{ vars.PORT }}
          HOST: ${{ vars.HOST }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          RATE_LIMIT_MAX: ${{ vars.RATE_LIMIT_MAX }}
          CLUSTER_ENABLED: ${{ vars.CLUSTER_ENABLED }}
          CACHE_ENABLED: ${{ vars.CACHE_ENABLED }}
          CACHE_TTL_SECONDS: ${{ vars.CACHE_TTL_SECONDS }}
